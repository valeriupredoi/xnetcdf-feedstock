schema_version: 1

context:
  name: xnetcdf
  version: "0.2.0"
  python_min: "3.11"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 9d4a5c09b7e8d67e80875ed0e4b27837583eadfc9ba627cad0f9fe83cec56e9a

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - numpy >=2
    - setuptools >=80
    - setuptools-scm >=8
  run:
    - python >=${{ python_min }}
    - numpy >=2
    - dask
    - fsspec
    - netCDF4
    - h5py
    - scipy
    - pyfive >=1.1.1
    - umfive >=0.3.0  # re-pin for 0.4.0
    - zarr >=3.1.3
    - xarray

tests:
  - python:
      imports:
        - xnetcdf
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - files:
      source:
        - tests
    requirements:
      run:
        - h5netcdf
        - pytest >6.0.0
        - pytest-cov
        - pytest-html
        - pytest-xdist
        - python ${{ python_min }}.*
    script:
      - pytest -n 2

about:
  homepage: https://github.com/NCAS-CMS/xnetcdf/
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: "xnetcdf is a Python open source library for representing datasets, in a variety of formats and accessed through diverse Python backends, with a common netCDF view."

extra:
  recipe-maintainers:
    - davidhassell
    - valeriupredoi
